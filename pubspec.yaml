name: movie_shelf
description: "Offline-first personal movie collection manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.11.0
  mobile_scanner: ^7.4.0
  cached_network_image: ^3.4.1
  go_router: ^17.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  equatable: ^2.1.0
  collection: ^1.19.1
  permission_handler: ^12.0.3
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mockito: ^5.6.4
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^2.7.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logo.png
  min_sdk_android: 23
  adaptive_icon_background: "#121418"
  adaptive_icon_foreground: logo.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#121418"
